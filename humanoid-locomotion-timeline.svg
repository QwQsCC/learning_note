<svg xmlns="http://www.w3.org/2000/svg" class="viz-root" viewBox="0 0 1800 1300" width="1800" height="1300" role="img" aria-labelledby="vizTitle vizDesc">
  <title id="vizTitle">Evolution of humanoid locomotion control — timeline of ten control paradigms</title>
  <desc id="vizDesc">A horizontal timeline from 1980 to 2030. Ten control paradigms are grouped into three families — Classical (blue), Learning-based (orange) and Emerging (aqua). Each bar starts at the year its paradigm first appeared and fades forward to show it is still active.</desc>

  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.44"/>
      <stop offset="0.45" stop-color="#2a78d6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834" stop-opacity="0.44"/>
      <stop offset="0.45" stop-color="#eb6834" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#eb6834" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1baf7a" stop-opacity="0.44"/>
      <stop offset="0.45" stop-color="#1baf7a" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1baf7a" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <style>
    /* ---- Light theme (default) ---- */
    .viz-root{
      color-scheme: light;
      --surface-1:#fcfcfb;
      --ink-1:#0b0b0b;
      --ink-2:#52514e;
      --ink-muted:#898781;
      --grid:#e1e0d9;
      --axis:#c3c2b7;
      --h1:#2a78d6;   /* Classical      */
      --h2:#eb6834;   /* Learning-based */
      --h3:#1baf7a;   /* Emerging       */
      --tint:0.055;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    /* ---- Dark theme: steps selected for the dark surface, not an auto-flip ----
       Force light  -&gt; add data-theme="light" to the svg root element.
       Force dark   -&gt; add data-theme="dark"  to the svg root element.        */
    @media (prefers-color-scheme: dark){
      .viz-root:not([data-theme="light"]){
        color-scheme: dark;
        --surface-1:#1a1a19;
        --ink-1:#ffffff;
        --ink-2:#c3c2b7;
        --ink-muted:#898781;
        --grid:#2c2c2a;
        --axis:#383835;
        --h1:#3987e5;
        --h2:#d95926;
        --h3:#199e70;
        --tint:0.14;
      }
    }
    .viz-root[data-theme="dark"]{
      color-scheme: dark;
      --surface-1:#1a1a19;
      --ink-1:#ffffff;
      --ink-2:#c3c2b7;
      --ink-muted:#898781;
      --grid:#2c2c2a;
      --axis:#383835;
      --h1:#3987e5;
      --h2:#d95926;
      --h3:#199e70;
      --tint:0.14;
    }

    /* gradient stops follow the theme; the attributes above are the fallback */
    .g1 stop{stop-color:var(--h1)}
    .g2 stop{stop-color:var(--h2)}
    .g3 stop{stop-color:var(--h3)}

    .c1{fill:var(--h1)} .c2{fill:var(--h2)} .c3{fill:var(--h3)}
    .b1{fill:url(#g1)}  .b2{fill:url(#g2)}  .b3{fill:url(#g3)}

    .dot{stroke:var(--surface-1);stroke-width:3}
    .rule{fill:none;stroke-width:1;stroke-opacity:.32}
    .r1{stroke:var(--h1)} .r2{stroke:var(--h2)} .r3{stroke:var(--h3)}
    .tint{fill-opacity:var(--tint)}
    .grid{stroke:var(--grid);stroke-width:1;fill:none}
    .panel{fill:none;stroke:var(--grid);stroke-width:1}
    .axis-line{stroke:var(--axis);stroke-width:1.5;fill:none}

    /* hover layer: rows highlight on pointer-over (native tooltip comes from each row title) */
    .row-hl{fill:var(--ink-1);fill-opacity:0;transition:fill-opacity .12s ease}
    .row:hover .row-hl{fill-opacity:.035}

    text{font-family:inherit}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:1.6px;fill:var(--ink-muted)}
    .title{font-size:30px;font-weight:700;letter-spacing:-0.3px;fill:var(--ink-1)}
    .subtitle{font-size:14.5px;fill:var(--ink-2)}
    .cat-name{font-size:12.5px;font-weight:700;letter-spacing:1.4px;fill:var(--ink-1)}
    .cat-meta{font-size:11.5px;fill:var(--ink-muted)}
    .m-name{font-size:18px;font-weight:600;fill:var(--ink-1)}
    .m-tech{font-size:12px;fill:var(--ink-muted)}
    .m-idea{font-size:13px;fill:var(--ink-2)}
    .yr{font-size:13px;font-weight:700;fill:var(--ink-1)}
    .tick{font-size:12px;fill:var(--ink-muted)}
    .note{font-size:12px;fill:var(--ink-muted)}
    .pill-text{font-size:11px;font-weight:700;letter-spacing:.8px;fill:var(--ink-2)}
  </style>

  <rect width="1800" height="1300" fill="var(--surface-1)"/>

  <!-- ============================ header ============================ -->
  <text class="eyebrow" x="44" y="48">HUMANOID ROBOTICS · LOCOMOTION CONTROL</text>
  <text class="title" x="44" y="90">Evolution of Humanoid Locomotion Control</text>
  <text class="subtitle" x="44" y="118">Ten control paradigms on one timeline — from ZMP (1980s) to world models (2025).</text>

  <!-- ============================ time axis ========================= -->
  <g>
    <text class="tick" x="620" y="166" text-anchor="middle">1980</text>
    <text class="tick" x="844" y="166" text-anchor="middle">1990</text>
    <text class="tick" x="1068" y="166" text-anchor="middle">2000</text>
    <text class="tick" x="1292" y="166" text-anchor="middle">2010</text>
    <text class="tick" x="1516" y="166" text-anchor="middle">2020</text>
    <text class="tick" x="1740" y="166" text-anchor="middle">2030</text>

    <path class="axis-line" d="M732 182v6M956 182v6M1180 182v6M1404 182v6M1628 182v6"/>
    <path class="axis-line" d="M620 182v8M844 182v8M1068 182v8M1292 182v8M1516 182v8M1740 182v8"/>

    <!-- solid to the present, dotted beyond it -->
    <path class="axis-line" d="M620 182H1650.4"/>
    <path class="axis-line" d="M1650.4 182H1740" stroke-dasharray="1 5" stroke-linecap="round"/>

    <path class="axis-line" d="M1650.4 174v16" stroke-width="2"/>
    <rect x="1627" y="146" width="47" height="20" rx="10" fill="var(--surface-1)" stroke="var(--axis)" stroke-width="1"/>
    <text class="pill-text" x="1650.4" y="160.5" text-anchor="middle">NOW</text>
  </g>

  <!-- ====================== panels, tints, grid ===================== -->
  <rect class="tint c1" x="20" y="214" width="1760" height="404"/>
  <rect class="tint c2" x="20" y="618" width="1760" height="312"/>
  <rect class="tint c3" x="20" y="930" width="1760" height="312"/>

  <path class="grid" d="M732 214V1242M844 214V1242M956 214V1242M1068 214V1242M1180 214V1242M1292 214V1242M1404 214V1242M1516 214V1242M1628 214V1242"/>
  <rect class="panel" x="20" y="214" width="1760" height="1028"/>

  <!-- ======================== category headers ===================== -->
  <g>
    <rect class="c1" x="44" y="227" width="12" height="12" rx="3"/>
    <text class="cat-name" x="66" y="238">CLASSICAL</text>
    <text class="cat-meta" x="182" y="238">4 paradigms · since the 1980s</text>
    <path class="rule r1" d="M44 249.5H1740"/>
  </g>
  <g>
    <rect class="c2" x="44" y="631" width="12" height="12" rx="3"/>
    <text class="cat-name" x="66" y="642">LEARNING-BASED</text>
    <text class="cat-meta" x="216" y="642">3 paradigms · since 2016</text>
    <path class="rule r2" d="M44 653.5H1740"/>
  </g>
  <g>
    <rect class="c3" x="44" y="943" width="12" height="12" rx="3"/>
    <text class="cat-name" x="66" y="954">EMERGING</text>
    <text class="cat-meta" x="170" y="954">3 paradigms · since 2024</text>
    <path class="rule r3" d="M44 965.5H1740"/>
  </g>

  <!-- ============================= rows ============================= -->
  <!-- 1 · Linear feedback control -->
  <g class="row">
    <title>Linear feedback control — since the 1980s — ZMP, Raibert's control, capture point</title>
    <rect class="row-hl" x="28" y="250" width="1744" height="92" rx="8"/>
    <rect class="b1" x="620" y="276" width="1120" height="44" rx="6"/>
    <circle class="dot c1" cx="620" cy="298" r="7"/>
    <text class="yr" x="642" y="303">1980s</text>
  </g>
  <text class="m-name" x="44" y="280">Linear feedback control</text>
  <text class="m-tech" x="44" y="304">ZMP · Raibert's control · capture point</text>
  <text class="m-idea" x="44" y="326">用降阶模型与线性系统理论，实时调节行走行为</text>

  <!-- 2 · Nonlinear feedback control -->
  <g class="row">
    <title>Nonlinear feedback control — since the 2000s — inverse dynamics, CLF-QP, whole-body QP</title>
    <rect class="row-hl" x="28" y="342" width="1744" height="92" rx="8"/>
    <rect class="b1" x="1068" y="368" width="672" height="44" rx="6"/>
    <circle class="dot c1" cx="1068" cy="390" r="7"/>
    <text class="yr" x="1090" y="395">2000s</text>
  </g>
  <text class="m-name" x="44" y="372">Nonlinear feedback control</text>
  <text class="m-tech" x="44" y="396">Inverse dynamics · CLF-QP · whole-body QP</text>
  <text class="m-idea" x="44" y="418">用全阶模型与非线性控制理论生成全身运动跟踪的关节力矩</text>

  <!-- 3 · Trajectory optimization -->
  <g class="row">
    <title>Trajectory optimization — since the 2010s — HZD, reduced-order model methods</title>
    <rect class="row-hl" x="28" y="434" width="1744" height="92" rx="8"/>
    <rect class="b1" x="1292" y="460" width="448" height="44" rx="6"/>
    <circle class="dot c1" cx="1292" cy="482" r="7"/>
    <text class="yr" x="1314" y="487">2010s</text>
  </g>
  <text class="m-name" x="44" y="464">Trajectory optimization</text>
  <text class="m-tech" x="44" y="488">HZD · reduced-order model methods</text>
  <text class="m-idea" x="44" y="510">长时域规划：选择落足点，优化质心与全身轨迹</text>

  <!-- 4 · MPC -->
  <g class="row">
    <title>Model predictive control — since the 2010s — reduced-order MPC, contact-implicit MPC, sampling-based</title>
    <rect class="row-hl" x="28" y="526" width="1744" height="92" rx="8"/>
    <rect class="b1" x="1292" y="552" width="448" height="44" rx="6"/>
    <circle class="dot c1" cx="1292" cy="574" r="7"/>
    <text class="yr" x="1314" y="579">2010s</text>
  </g>
  <text class="m-name" x="44" y="556">Model predictive control</text>
  <text class="m-tech" x="44" y="580">Reduced-order MPC · contact-implicit MPC · sampling-based</text>
  <text class="m-idea" x="44" y="602">短时域预测控制与在线重规划，求解接触选择</text>

  <!-- 5 · RL with pure simulation -->
  <g class="row">
    <title>RL with pure simulation — since 2016 — policy gradient, curriculum learning, teacher-student</title>
    <rect class="row-hl" x="28" y="654" width="1744" height="92" rx="8"/>
    <rect class="b2" x="1426.4" y="680" width="313.6" height="44" rx="6"/>
    <circle class="dot c2" cx="1426.4" cy="702" r="7"/>
    <text class="yr" x="1448.4" y="707">2016</text>
  </g>
  <text class="m-name" x="44" y="684">RL with pure simulation</text>
  <text class="m-tech" x="44" y="708">Policy gradient · curriculum learning · teacher–student</text>
  <text class="m-idea" x="44" y="730">物理仿真大规模并行训练：离线学策略、在线出运动</text>

  <!-- 6 · RL with real-world data -->
  <g class="row">
    <title>RL with real-world data — since 2018 — motion imitation, residual learning</title>
    <rect class="row-hl" x="28" y="746" width="1744" height="92" rx="8"/>
    <rect class="b2" x="1471.2" y="772" width="268.8" height="44" rx="6"/>
    <circle class="dot c2" cx="1471.2" cy="794" r="7"/>
    <text class="yr" x="1493.2" y="799">2018</text>
  </g>
  <text class="m-name" x="44" y="776">RL with real-world data</text>
  <text class="m-tech" x="44" y="800">Motion imitation · residual learning</text>
  <text class="m-idea" x="44" y="822">以人体动作为参考，用真实数据修正残差，弥合仿真到现实差距</text>

  <!-- 7 · Model-guided RL -->
  <g class="row">
    <title>Model-guided RL — since 2020 — tracking trajectories, controllers for reward shaping</title>
    <rect class="row-hl" x="28" y="838" width="1744" height="92" rx="8"/>
    <rect class="b2" x="1516" y="864" width="224" height="44" rx="6"/>
    <circle class="dot c2" cx="1516" cy="886" r="7"/>
    <text class="yr" x="1538" y="891">2020</text>
  </g>
  <text class="m-name" x="44" y="868">Model-guided RL</text>
  <text class="m-tech" x="44" y="892">Tracking trajectories · controllers for reward shaping</text>
  <text class="m-idea" x="44" y="914">用模型方法引导学习，把轨迹或控制器嵌入奖励函数</text>

  <!-- 8 · LLM / VLM guidance -->
  <g class="row">
    <title>LLM / VLM guidance — since 2024 — LLM/VLM-conditioned control</title>
    <rect class="row-hl" x="28" y="966" width="1744" height="92" rx="8"/>
    <rect class="b3" x="1605.6" y="992" width="134.4" height="44" rx="6"/>
    <circle class="dot c3" cx="1605.6" cy="1014" r="7"/>
    <text class="yr" x="1627.6" y="1019">2024</text>
  </g>
  <text class="m-name" x="44" y="996">LLM / VLM guidance</text>
  <text class="m-tech" x="44" y="1020">LLM/VLM-conditioned control</text>
  <text class="m-idea" x="44" y="1042">以语言和视觉为条件，实现目标接地与高层语义规划</text>

  <!-- 9 · Diffusion motion models -->
  <g class="row">
    <title>Diffusion motion models — since 2025 — generative gait and trajectory priors</title>
    <rect class="row-hl" x="28" y="1058" width="1744" height="92" rx="8"/>
    <rect class="b3" x="1628" y="1084" width="112" height="44" rx="6"/>
    <circle class="dot c3" cx="1628" cy="1106" r="7"/>
    <text class="yr" x="1650" y="1111">2025</text>
  </g>
  <text class="m-name" x="44" y="1088">Diffusion motion models</text>
  <text class="m-tech" x="44" y="1112">Generative gait &amp; trajectory priors</text>
  <text class="m-idea" x="44" y="1134">用扩散先验采样多样可行运动，作跟踪与正则目标</text>

  <!-- 10 · World / foundation models -->
  <g class="row">
    <title>World / foundation models — since 2025 — latent predictive dynamics</title>
    <rect class="row-hl" x="28" y="1150" width="1744" height="92" rx="8"/>
    <rect class="b3" x="1628" y="1176" width="112" height="44" rx="6"/>
    <circle class="dot c3" cx="1628" cy="1198" r="7"/>
    <text class="yr" x="1650" y="1203">2025</text>
  </g>
  <text class="m-name" x="44" y="1180">World / foundation models</text>
  <text class="m-tech" x="44" y="1204">Latent predictive dynamics</text>
  <text class="m-idea" x="44" y="1226">从数据学习隐动力学，在隐空间想象推演完成控制</text>

  <!-- gutter divider -->
  <path class="grid" d="M608 214V1242"/>

  <!-- ============================ footer =========================== -->
  <text class="note" x="44" y="1274">Source: Gu, Shi, Shi et al., “Evolution of humanoid locomotion control,” Table 1. Each bar starts at the year a paradigm first appeared and fades forward — all ten remain active.</text>
</svg>